{% extends "base.html" %}

{% block title %}Страница не найдена - EduSpace{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="text-center">
        <h1 class="text-9xl font-bold text-indigo-600">404</h1>
        <h2 class="text-3xl font-bold text-gray-900 mt-4">Страница не найдена</h2>
        <p class="text-gray-600 mt-2">Запрашиваемая страница не существует.</p>
        <a href="{{ url_for('index') }}" class="inline-flex items-center px-6 py-3 mt-6 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition-colors duration-200">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
