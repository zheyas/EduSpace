{% extends "admin/base.html" %}

{% block title %}Редактирование теста — EduSpace{% endblock %}
{% block page_title %}Редактирование теста: {{ test_data.test.title }}{% endblock %}

{% block extra_css %}
<style>
    .test-edit-container {
        max-width: 1000px;
        margin: 0 auto;
    }

    .test-info {
        background: rgba(40, 40, 40, 0.7);
        border: 1px solid rgba(255, 121, 254, 0.3);
        border-radius: 15px;
        padding: 1.5rem;
        margin-bottom: 2rem;
    }

    .test-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
    }

    .test-title {
        font-family: 'Orbitron', monospace;
        color: var(--secondary-color);
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }

    .test-id {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
    }

    .test-meta {
        display: flex;
        gap: 2rem;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.9rem;
    }

    .meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .questions-section {
        background: rgba(40, 40, 40, 0.7);
        border: 1px solid rgba(255, 121, 254, 0.3);
        border-radius: 15px;
        padding: 1.5rem;
        margin-top: 2rem;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 121, 254, 0.2);
    }

    .section-title {
        font-family: 'Orbitron', monospace;
        color: var(--secondary-color);
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }

    .questions-list {
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    .question-card {
        background: rgba(26, 26, 26, 0.5);
        border: 1px solid rgba(255, 121, 254, 0.2);
        border-radius: 12px;
        padding: 1.5rem;
        position: relative;
    }

    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: flex
